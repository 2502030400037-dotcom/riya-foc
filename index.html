<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Modal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    /* Open button */
    .open-btn {
      margin: 50px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    /* Modal background */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    /* Modal box */
    .modal-content {
      width: 90%;
      max-width: 500px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-top: 20px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: none;
      font-size: 14px;
    }

    .generate-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      cursor: pointer;
    }

    .response {
      margin-top: 20px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <button class="open-btn" onclick="openModal()">
    ✨ Ask AI
  </button>

  <div class="modal" id="aiModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2>✨ AI Assistant</h2>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>

      <textarea id="prompt" placeholder="Ask something..."></textarea>

      <button class="generate-btn" onclick="askAI()">
        Generate
      </button>

      <div class="response" id="response">
        AI response will appear here...
      </div>

    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("aiModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("aiModal").style.display = "none";
    }

    function askAI() {
      const prompt = document.getElementById("prompt").value;
      const response = document.getElementById("response");

      if (!prompt.trim()) {
        response.innerText = "Please enter a question.";
      } else {
        response.innerText =
          "AI response for: " + prompt;
      }

      response.style.display = "block";
    }

    // Close when clicking outside the modal
    window.onclick = function(event) {
      const modal = document.getElementById("aiModal");

      if (event.target === modal) {
        closeModal();
      }
    };
  </script>

</body>
</html>
