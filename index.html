<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Modal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    /* Open button */
    .open-btn {
      margin: 100px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    /* Modal background */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    /* Modal box */
    .modal-content {
      width: 90%;
      max-width: 450px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      border: none;
      background: none;
      font-size: 24px;
      cursor: pointer;
    }

    .ai-input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: none;
    }

    .ask-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button class="open-btn" onclick="openModal()">
    ✨ Ask AI
  </button>

  <div class="modal" id="aiModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2>✨ Ask AI</h2>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>

      <p>How can I help you?</p>

      <textarea
        class="ai-input"
        rows="4"
        placeholder="Type your question..."
      ></textarea>

      <button class="ask-btn">
        Ask AI
      </button>

    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("aiModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("aiModal").style.display = "none";
    }

    // Close when clicking outside the modal
    window.onclick = function(event) {
      const modal = document.getElementById("aiModal");

      if (event.target === modal) {
        closeModal();
      }
    };
  </script>

</body>
</html>
